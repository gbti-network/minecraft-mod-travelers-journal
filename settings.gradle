pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
	// Groovy scripts: the controller is stonecutter.gradle and the shared node script is build.gradle
	kotlinController = false
	centralScript = 'build.gradle'

	create(getRootProject()) {
		// One node per released jar. versions/<node>/gradle.properties holds the Minecraft version
		// the node builds against and the range of versions its jar declares.
		versions '1.21.1', '1.21.2', '1.21.5', '1.21.6', '1.21.11', '26.1', '26.3'
		// The node whose state the committed src/ is in. Keep it equal to stonecutter.active.
		vcsVersion = '26.3'
	}
}

rootProject.name = 'travelers-journal'
