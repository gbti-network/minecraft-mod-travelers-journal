// Shared build script. Stonecutter evaluates it once per node (versions/<node>/), each time with
// that node's gradle.properties layered over the root one.

// Minecraft is obfuscated before 26.1. Those nodes use the remapping Loom with Mojang's names and
// ship a jar remapped to intermediary; 26.1 and later use the plain Loom and ship the plain jar.
def obfuscated = sc.current.parsed.matches('<26.1')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
// The remapping Loom resolves mods through mod* configurations; the plain Loom uses Gradle's own
def modImplementation = obfuscated ? 'modImplementation' : 'implementation'
def modJarTask = obfuscated ? 'remapJar' : 'jar'
def javaVersion = (project.java_version as String) as int

version = "${project.mod_version}+${project.mc_label}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The probe is the test mod scripts/test-matrix.sh loads beside the packaged jar. It builds into
// its own jar and never ships.
sourceSets {
	probe {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		mappings loom.officialMojangMappings()
	}
	add modImplementation, "net.fabricmc:fabric-loader:${project.loader_version}"
	add modImplementation, "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = javaVersion
}

def resourceProps = [version: project.version, mc_range: project.mc_range, java_version: javaVersion]
[processResources, processProbeResources].each { task ->
	task.inputs.properties resourceProps
	task.filesMatching('fabric.mod.json') {
		expand resourceProps
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

def probeJar = tasks.register('probeJar', Jar) {
	from sourceSets.probe.output
	archiveClassifier = obfuscated ? 'probe-dev' : 'probe'
	destinationDirectory = layout.buildDirectory.dir(obfuscated ? 'devlibs' : 'libs')
}
def probeModJar = probeJar
if (obfuscated) {
	probeModJar = tasks.register('remapProbeJar', net.fabricmc.loom.task.RemapJarTask) {
		inputFile = probeJar.flatMap { it.archiveFile }
		archiveClassifier = 'probe'
	}
}
tasks.named('build') {
	dependsOn probeModJar
}

// Copies this node's mod jar and probe jar to <root>/build/libs/, so one directory holds them all
tasks.register('buildAndCollect', Copy) {
	group = 'build'
	description = 'Builds this node and copies its mod and probe jars into the root build/libs/.'
	from tasks.named(modJarTask).flatMap { it.archiveFile }
	from probeModJar.flatMap { it.archiveFile }
	into rootProject.layout.buildDirectory.dir('libs')
}
