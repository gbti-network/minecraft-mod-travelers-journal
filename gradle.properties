# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Shared by every node; versions/<node>/gradle.properties holds the per-version values
loom_version=1.19.1
loader_version=0.19.5

# Mod Properties
mod_version=2.0.0
maven_group=com.gbti
archives_base_name=travelers-journal

# The build scripts are Groovy on purpose; this only silences Stonecutter's banner about it
dev.kikugie.stonecutter.hard_mode=true
